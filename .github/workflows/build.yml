name: Сборка APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Android SDK уже установлен на сервере сборки (ANDROID_HOME)
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Ключ подписи хранится в секретах репозитория, чтобы обновления ставились поверх старой версии
      - name: Ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "Секрет KEYSTORE_BASE64 не задан, APK будет подписан временным ключом"
          fi

      - name: Сборка
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease --console=plain 2>&1 | tee build.log

      # Ошибки сборки выводятся пометками, чтобы их было видно без входа в GitHub
      - name: Ошибки (1)
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Could not|Execution failed|> " build.log | grep -v "^> Task" | head -40 > errs.txt || true
          head -10 errs.txt | while IFS= read -r l; do echo "::error::$l"; done
          sed -n '11,20p' errs.txt | while IFS= read -r l; do echo "::warning::$l"; done
      - name: Ошибки (2)
        if: failure()
        run: |
          sed -n '21,30p' errs.txt | while IFS= read -r l; do echo "::error::$l"; done
          sed -n '31,40p' errs.txt | while IFS= read -r l; do echo "::warning::$l"; done

      - uses: actions/upload-artifact@v4
        with:
          name: StarRemote-apk
          path: app/build/outputs/apk/release/*.apk
